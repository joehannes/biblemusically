# Build every platform and attach the results to a GitHub release.
#
#   git tag v0.88.0 && git push origin v0.88.0
#
# The release is created as a **draft** and the app's update endpoint ignores drafts, so a half-finished
# matrix can never be offered to anybody as an update. Publish it by hand once the assets you care about
# are there.
#
# TWO THINGS TO KNOW BEFORE RELYING ON THIS:
#
# 1. macOS and iOS need macOS runners, and on a private repository GitHub bills macOS minutes at **10×**.
#    A 12-minute macOS build spends 120 minutes of a 2,000-minute monthly allowance. Two platforms, a few
#    releases a month, and the allowance is gone. So **a tag push builds Linux, Windows and Android only**.
#    Apple is opt-in: run the workflow by hand with `apple: true`, or build those targets locally and add
#    them to the same release with `gh release upload <tag> <file>`.
#
# 1a. **The Android APK must be signed or it is not installable.** Android refuses an unsigned APK
#    outright — that is not a toggle a user can flip. Set ANDROID_KEYSTORE_BASE64 and friends (the
#    "Signing key" step below lists the exact commands); without them the job falls back to a debug
#    build, which is installable but cannot update a release install.
#
# 2. **An unsigned iOS build cannot be installed on a stock iPhone.** Apple requires a signature; there is
#    no "allow unknown sources" on iOS. The honest routes are TestFlight (Apple Developer Program, a
#    review, then it installs like any app) or AltStore/SideStore, where the user signs the IPA with their
#    own Apple ID — free accounts must re-sign every 7 days, paid ones last a year. This workflow produces
#    the unsigned IPA; docs/INSTALL.md explains both routes plainly rather than implying it just works.
#    Android has no such problem: an APK plus one system toggle is genuinely enough.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (existing or new)"
        required: true
      apple:
        description: "Also build macOS and iOS (10× the minutes — see the note at the top)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The cheap job that has to pass before anything expensive runs. There was no test job at all, which
  # is the deeper reason translation coverage could fall from 100% to 86.6% across four releases with
  # every check green: the checks existed, nothing ran them.
  #
  # One Linux runner, a couple of minutes, billed 1× — against a full matrix of roughly 410 minutes.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --legacy-peer-deps
      - name: Unit tests
        run: npm run test:unit
      # The inventory must match the source…
      - name: Interface string inventory is current
        run: npm run i18n:check
      # …and the backlog of untranslated strings must not have grown. See src/src/i18n/coverage-floor.json.
      - name: Translation backlog has not grown
        run: npm run i18n:gate
      # Present-but-wrong is invisible to a coverage number: an English string echoed back, a dropped
      # {0}, a translation three times the length of its source.
      - name: Translation quality audit
        run: npm run i18n:audit
      # The seam between Rust and api.js is a pair of strings, so nothing else catches a typo'd
      # command name, a command missing from generate_handler!, or a whole feature that was built
      # and never given a button. Thirty of the last kind were found by hand in 2026-08.
      - name: Every command is reachable, and reaches something
        run: npm run audit:ipc

  # Made first and separately so every platform job attaches to the same release rather than racing to
  # create it — which is how you end up with five releases for one tag.
  draft:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      desktop: ${{ steps.plan.outputs.desktop }}
      apple: ${{ steps.plan.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Which platforms this run builds, decided here so the matrix below can be shorter on a tag push
      # than on a deliberate release. The arithmetic behind it, for a private repository on the free
      # 2,000-minute allowance: Linux bills 1×, Windows 2×, macOS 10×. One full matrix is roughly
      # 15 + 30 + 15 + 150 + 200 ≈ 410 minutes, so about five tag pushes exhaust a month — and this
      # project tags many times a day. Apple therefore builds when asked for, not on every tag.
      #
      # Nothing is lost by that: an unsigned iOS build cannot be installed on a stock device anyway
      # (see the note at the top), and a macOS .dmg can be built locally and added to the same release
      # with `gh release upload <tag> <file>`.
      - id: plan
        run: |
          if [ "${{ github.event.inputs.apple }}" = "true" ]; then
            echo 'desktop=[{"os":"ubuntu-22.04","name":"linux"},{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"}]' >> "$GITHUB_OUTPUT"
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo 'desktop=[{"os":"ubuntu-22.04","name":"linux"},{"os":"windows-latest","name":"windows"}]' >> "$GITHUB_OUTPUT"
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.pick.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "reusing $TAG"
          else
            # The notes become what the app shows in its update prompt, so they are worth writing.
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Studio Lightkid $TAG

          Installing: see docs/INSTALL.md. Android needs one system toggle; iOS needs TestFlight or
          AltStore, because Apple does not allow unsigned installs."
          fi

  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.draft.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable

      # Ubuntu 22.04 rather than latest: Tauri 2 links against webkit2gtk-4.1, and the app pins
      # webkit2gtk/javascriptcore to the exact versions wry itself pins. A newer runner drifts off that.
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
                                  patchelf libssl-dev build-essential curl wget file

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # --legacy-peer-deps because react-day-picker@8 declares a peer of date-fns ^2||^3 while this
      # project is on date-fns 4. The pairing works — the calendar only uses formatting helpers that are
      # unchanged across those majors — so the honest fix is to say so here rather than to downgrade a
      # dependency the rest of the app uses.
      #
      # This flag was *not*, however, why every release from v0.88.0 to v0.106.0 failed here in under two
      # minutes. That was package-lock.json: it had been left at a June state describing 138 packages
      # while package.json had grown to 53 dependencies including 27 @radix-ui ones, and `npm ci` refuses
      # a lockfile that is out of sync (EUSAGE) rather than quietly resolving it. `npm ci` is right to —
      # but it means the lockfile has to be regenerated and committed whenever a dependency changes, or
      # every platform fails at once, before compiling a line.
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      # `bundle.resources` in tauri.conf.json declares packaging/node_modules, and .gitignore excludes
      # it — so it exists on a developer's machine and never in a fresh clone. tauri_build fails on
      # the missing resource before compiling a line, which is why all three platforms died
      # identically in build.rs with nothing useful in the log.
      #
      # The repo already carries node_modules_backup (tracked, 171 files) for exactly this. Restoring
      # it is cheaper and more reproducible than an `npm install` that could resolve a different
      # Playwright than the one the app was tested against.
      - name: Restore bundled packaging resources
        shell: bash
        run: |
          if [ -d src-tauri/packaging/node_modules ]; then exit 0; fi
          # `npm ci`, not a copy of the tracked backup.
          #
          # node_modules_backup/.bin/playwright is a symlink, and Windows refuses to *create* one
          # without Developer Mode or admin rights — so `cp -r` failed there, and `cp -rL` fails the
          # same way, because -L only dereferences the source. The problem is the destination.
          #
          # packaging/package-lock.json is committed, so an install here is as reproducible as the
          # copy was and works identically on all three runners.
          (cd src-tauri/packaging && npm ci --omit=dev --no-audit --no-fund) \
            || (cd src-tauri/packaging && npm install --omit=dev --no-audit --no-fund)

      - name: Build the app
        run: npx tauri build
        env:
          # Unsigned on macOS: signing needs a Developer ID certificate, which is a paid account and a
          # secret this workflow deliberately does not assume exists. Users will see Gatekeeper's warning
          # and need right-click → Open once; docs/INSTALL.md says so.
          CI: true

      - name: Collect the artefacts
        shell: bash
        run: |
          mkdir -p out
          # Copy whatever this platform actually produced rather than guessing at paths per OS.
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*.exe' \) -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.draft.outputs.tag }}" out/* --clobber

  android:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        # JDK 17: AGP rejects 21+ outright, and the system default on most images is newer.
        with: { distribution: temurin, java-version: "17" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi" }
      - uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          sdkmanager --install "ndk;29.0.13846066" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"

      # The launcher icon. `tauri android init` scaffolds gen/android from a template carrying Tauri's
      # own logo and never consults src-tauri/icons/android again, so without this CI ships an APK
      # wearing the default icon. Brings the adaptive icon too (mipmap-anydpi-v26 plus the background
      # colour it references), which the template omits — and which is what Android 8+ actually uses.
      - name: Launcher icons
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # Signing, and why a release build without it is worthless.
      #
      # **An unsigned APK cannot be installed on Android at all.** Not "warns", not "needs a toggle" —
      # refused. "Unsigned" is not something a user can allow; an unknown *source* is. So a release job
      # that produces an unsigned APK produces an artefact nobody can use, which is what this workflow
      # did before: the signing config in build.gradle.kts only applies when a keystore is present, and
      # keystore.properties is gitignored because a private key does not belong in a repository.
      #
      # With the secrets set, CI signs with the same key as a local build — which matters beyond
      # installing at all: Android identifies an app by its signature, so a CI build signed with a
      # different key could not update a locally-installed one, only replace it and take its data.
      #
      #   gh secret set ANDROID_KEYSTORE_BASE64 < <(base64 -w0 ~/.config/studio-lightkid/android-release.keystore)
      #   gh secret set ANDROID_KEYSTORE_PASSWORD
      #   gh secret set ANDROID_KEY_ALIAS
      #   gh secret set ANDROID_KEY_PASSWORD
      #
      # Without them the job still produces something installable rather than nothing: a *debug* build,
      # which Android's debug keystore signs automatically. It is bigger and slower, and it cannot
      # update a release install, but it runs on a phone — which an unsigned release APK does not.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > src-tauri/gen/android/app/keystore.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the project release key."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building a debug APK, because an unsigned release APK cannot be installed."
          fi

      # --legacy-peer-deps because react-day-picker@8 declares a peer of date-fns ^2||^3 while this
      # project is on date-fns 4. The pairing works — the calendar only uses formatting helpers that are
      # unchanged across those majors — so the honest fix is to say so here rather than to downgrade a
      # dependency the rest of the app uses.
      #
      # This flag was *not*, however, why every release from v0.88.0 to v0.106.0 failed here in under two
      # minutes. That was package-lock.json: it had been left at a June state describing 138 packages
      # while package.json had grown to 53 dependencies including 27 @radix-ui ones, and `npm ci` refuses
      # a lockfile that is out of sync (EUSAGE) rather than quietly resolving it. `npm ci` is right to —
      # but it means the lockfile has to be regenerated and committed whenever a dependency changes, or
      # every platform fails at once, before compiling a line.
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      # `bundle.resources` in tauri.conf.json declares packaging/node_modules, and .gitignore excludes
      # it — so it exists on a developer's machine and never in a fresh clone. tauri_build fails on
      # the missing resource before compiling a line, which is why all three platforms died
      # identically in build.rs with nothing useful in the log.
      #
      # The repo already carries node_modules_backup (tracked, 171 files) for exactly this. Restoring
      # it is cheaper and more reproducible than an `npm install` that could resolve a different
      # Playwright than the one the app was tested against.
      - name: Restore bundled packaging resources
        shell: bash
        run: |
          if [ -d src-tauri/packaging/node_modules ]; then exit 0; fi
          # `npm ci`, not a copy of the tracked backup.
          #
          # node_modules_backup/.bin/playwright is a symlink, and Windows refuses to *create* one
          # without Developer Mode or admin rights — so `cp -r` failed there, and `cp -rL` fails the
          # same way, because -L only dereferences the source. The problem is the destination.
          #
          # packaging/package-lock.json is committed, so an install here is as reproducible as the
          # copy was and works identically on all three runners.
          (cd src-tauri/packaging && npm ci --omit=dev --no-audit --no-fund) \
            || (cd src-tauri/packaging && npm install --omit=dev --no-audit --no-fund)

      # ring compiles C under rustls, and the NDK only ships API-versioned clang wrappers while cc-rs
      # looks for an unversioned name. Without these the build fails on a missing compiler that is
      # actually present under a different name.
      - name: Build the APK
        run: |
          TOOLS="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TOOLS/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLS/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLS/aarch64-linux-android24-clang"
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            npx tauri android build --apk --target aarch64
          else
            npx tauri android build --apk --debug --target aarch64
          fi

      # Named for the app and the version, matching `npm run build:apk`. Gradle calls every APK
      # `app-universal-release.apk`, which in a downloads folder is indistinguishable from every other
      # release and overwrites the previous one. The update endpoint matches assets by the `.apk`
      # extension, so the name is free to be useful.
      - name: Attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # -r, because without it xargs runs `ls -t` even on no matches, `ls -t` with no arguments
          # lists the working directory, and APK becomes an arbitrary repo file rather than empty.
          APK="$(find src-tauri/gen/android -name '*.apk' -print0 \
                 | xargs -0 -r ls -t 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then echo "No APK was produced." >&2; exit 1; fi
          mkdir -p out
          cp "$APK" "out/lightkid_studio_${VERSION}.apk"

          # Say plainly whether what we are about to publish can be installed. An unsigned APK is
          # refused by Android outright, and finding that out on a phone is the expensive way.
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify "out/lightkid_studio_${VERSION}.apk" \
            && echo "APK is signed." \
            || echo "::error::The APK is unsigned and cannot be installed — set ANDROID_KEYSTORE_BASE64."

          gh release upload "${{ needs.draft.outputs.tag }}" "out/lightkid_studio_${VERSION}.apk" --clobber

  ios:
    needs: draft
    if: needs.draft.outputs.apple == 'true'
    runs-on: macos-latest
    # Allowed to fail without failing the release: an unsigned iOS build is the least reliable job here,
    # and it must not stop the four platforms that install without ceremony.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios" }
      # --legacy-peer-deps because react-day-picker@8 declares a peer of date-fns ^2||^3 while this
      # project is on date-fns 4. The pairing works — the calendar only uses formatting helpers that are
      # unchanged across those majors — so the honest fix is to say so here rather than to downgrade a
      # dependency the rest of the app uses.
      #
      # This flag was *not*, however, why every release from v0.88.0 to v0.106.0 failed here in under two
      # minutes. That was package-lock.json: it had been left at a June state describing 138 packages
      # while package.json had grown to 53 dependencies including 27 @radix-ui ones, and `npm ci` refuses
      # a lockfile that is out of sync (EUSAGE) rather than quietly resolving it. `npm ci` is right to —
      # but it means the lockfile has to be regenerated and committed whenever a dependency changes, or
      # every platform fails at once, before compiling a line.
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      # `bundle.resources` in tauri.conf.json declares packaging/node_modules, and .gitignore excludes
      # it — so it exists on a developer's machine and never in a fresh clone. tauri_build fails on
      # the missing resource before compiling a line, which is why all three platforms died
      # identically in build.rs with nothing useful in the log.
      #
      # The repo already carries node_modules_backup (tracked, 171 files) for exactly this. Restoring
      # it is cheaper and more reproducible than an `npm install` that could resolve a different
      # Playwright than the one the app was tested against.
      - name: Restore bundled packaging resources
        shell: bash
        run: |
          if [ -d src-tauri/packaging/node_modules ]; then exit 0; fi
          # `npm ci`, not a copy of the tracked backup.
          #
          # node_modules_backup/.bin/playwright is a symlink, and Windows refuses to *create* one
          # without Developer Mode or admin rights — so `cp -r` failed there, and `cp -rL` fails the
          # same way, because -L only dereferences the source. The problem is the destination.
          #
          # packaging/package-lock.json is committed, so an install here is as reproducible as the
          # copy was and works identically on all three runners.
          (cd src-tauri/packaging && npm ci --omit=dev --no-audit --no-fund) \
            || (cd src-tauri/packaging && npm install --omit=dev --no-audit --no-fund)

      - name: Build an unsigned IPA
        run: |
          npx tauri ios init --ci || true
          # No signing identity in CI, so this produces an unsigned archive. It cannot be installed on a
          # stock device as-is — see the note at the top of this file and docs/INSTALL.md.
          npx tauri ios build --export-method debugging || \
          xcodebuild -workspace src-tauri/gen/apple/*.xcodeproj/project.xcworkspace \
            -scheme "*" -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO archive || true

      - name: Attach whatever built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/gen/apple -name '*.ipa' -o -name '*.xcarchive' | head -5
          find src-tauri/gen/apple -name '*.ipa' -exec \
            gh release upload "${{ needs.draft.outputs.tag }}" {} --clobber \; || \
            echo "No IPA produced — expected without a signing identity."
