    [package]
name = "ai-music-video-studio"
version = "0.69.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["devtools", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

# Persistence is plain JSON files (see store.rs) — there is no database driver and no `mongod`
# sidecar any more. `bson` stays, but only as a *serialization* crate: it provides the `doc! { … }`
# filter/update literals the ~380 store call sites are written with, has no client, no sockets and
# no server, and cross-compiles to Android (the mongodb driver + a native mongod binary could not,
# which is what blocked the mobile build).
bson             = { version = "2", features = ["chrono-0_4"] }

# Async runtime
tokio            = { version = "1", features = ["full"] }
tokio-stream     = { version = "0.1", features = ["net"] }
futures-util     = "0.3"

# HTTP client. rustls instead of the default native-tls/openssl backend: openssl-sys needs a
# target-matching OpenSSL (headers + libs) to cross-compile, which desktop builds get from the
# system package but which isn't available for Android's NDK targets — the mobile build failed
# here with "openssl/opensslconf.h file not found" until this switched to a pure-Rust TLS stack
# with no C toolchain/target-specific library dependency. mongodb already uses rustls too, so
# this also means the app links one TLS implementation instead of two.
reqwest          = { version = "0.12", default-features = false, features = ["json", "multipart", "blocking", "rustls-tls"] }

# Lightweight local callback server used to receive proxy login notifications
warp = "0.3"

# Credential vault (see vault.rs) + content hashing for the asset manifest. All pure Rust, no C
# toolchain, so they cross-compile to Android like the rest of the crate: XChaCha20-Poly1305 for
# authenticated encryption of the stored secrets, Argon2id to turn a passphrase into a key, and
# SHA-256/HMAC for asset checksums and S3-style upload signatures.
chacha20poly1305 = "0.10"
argon2           = "0.5"
sha2             = "0.10"
hmac             = "0.12"
base64           = "0.22"
zeroize          = "1"

# Utilities
uuid             = { version = "1", features = ["v4"] }
regex            = "1"
dotenvy          = "0.15"
chrono           = { version = "0.4", features = ["serde"] }
which            = "6"
anyhow           = "1"
thiserror        = "1"
once_cell        = "1"
rand             = "0.8"
log              = "0.4"
env_logger       = "0.11"
dirs             = "5"
url = "2"
open = "3"
urlencoding = "2"
tar = "0.4.40"

# Native file/message dialogs. No Android backend exists, and mobile has its own dialog plugin,
# so this is desktop-only — an unconditional dependency is a hard failure on the Android target.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17.2"

# Tauri's set_position/set_size are no-ops for child webviews on Linux (see commands/webview.rs),
# so the embedded browser places them through GTK itself. Must track the gtk version tauri links
# against, or the widget types won't match.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Same pin as wry 0.55's own webkit2gtk/javascriptcore-rs dependencies (see commands/webview.rs
# bmChannel bridge) — must be the exact same versions or cargo links two copies of the sys
# crates and the types don't match.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
javascriptcore = { package = "javascriptcore-rs", version = "=1.1.2", features = ["v2_28"] }

[features]
default          = ["custom-protocol"]
custom-protocol  = ["tauri/custom-protocol"]

[profile.release]
panic            = "abort"
codegen-units    = 1
